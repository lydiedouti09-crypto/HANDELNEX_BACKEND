security:
    password_hashers:
        App\Entity\Admin:
            algorithm: auto

    providers:
        app_admin_provider:
            entity:
                class: App\Entity\Admin
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        # Firewall dédié à la connexion : reçoit email/password en JSON, renvoie un token JWT
        login:
            pattern: ^/api/login
            stateless: true
            json_login:
                check_path: api_login_check
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        # Firewall pour le reste de l'API : vérifie le token JWT sur chaque requête
        api:
            pattern: ^/api
            stateless: true
            jwt: ~

        main:
            lazy: true
            security: false

    access_control:
        - { path: ^/api/login, roles: PUBLIC_ACCESS }
        # Lecture publique (le site React public doit pouvoir lire sans être connecté)
        - { path: ^/api, roles: PUBLIC_ACCESS, methods: [GET] }
        # Écriture réservée à l'admin connecté (POST/PUT/DELETE)
        - { path: ^/api, roles: ROLE_ADMIN }